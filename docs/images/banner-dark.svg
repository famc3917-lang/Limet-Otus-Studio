    <text x="640" y="392"><tspan class="red" font-weight="700">03</tspan><tspan class="ink" dx="14">Payments</tspan></text>
    <text x="928" y="392"><tspan class="red" font-weight="700">04</tspan><tspan class="ink" dx="14">Delivery</tspan></text>
